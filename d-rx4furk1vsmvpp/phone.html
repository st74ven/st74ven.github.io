<style>
:root{color-scheme:light;--bg:#f4f3f0;--card:#fcfcfb;--text:#0b0b0b;--muted:#52514e;--border:#e2e0db;--accent:#2a78d6}

label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-top:12px}
#err{color:#d03b3b;font-size:14px;min-height:20px;margin-top:8px}
</style></head><body>

async function open(pw, remember){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(BOX.salt), iterations:BOX.iterations, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(BOX.iv)}, key, b64(BOX.data));
  if (remember) { try { localStorage.setItem('crd-pw', pw); } catch (e) {} }
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
